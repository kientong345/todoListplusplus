server {
    listen 80;
    server_name localhost;

    # 1. Serve Frontend (React Static Files)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Important for React Router: Redirect all requests not found to index.html
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to Backend
    location /api/ {
        proxy_pass http://todolistplusplus-server.glacial.site/api/v1/; # Ensure trailing slash if you want exact mapping
        
        proxy_set_header Host todolistplusplus-server.glacial.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support cookie login
        proxy_cookie_domain todolistplusplus-server.glacial.site localhost; 
        proxy_pass_header Set-Cookie;
    }
}