<svg viewBox="0 0 80 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="notebook-gradient" x1="0" y1="0" x2="80" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  
  <!-- Notebook Cover -->
  <rect width="80" height="110" rx="8" fill="url(#notebook-gradient)"/>
  
  <!-- Spine/Rings Area -->
  <rect x="0" width="10" height="110" rx="2" fill="#4338CA" fill-opacity="0.8"/>
  
  <!-- White Paper Page -->
  <rect x="16" y="8" width="56" height="94" rx="4" fill="white" fill-opacity="0.95"/>
  
  <!-- Rings -->
  <circle cx="5" cy="15" r="2" fill="#E2E8F0"/>
  <circle cx="5" cy="30" r="2" fill="#E2E8F0"/>
  <circle cx="5" cy="45" r="2" fill="#E2E8F0"/>
  <circle cx="5" cy="60" r="2" fill="#E2E8F0"/>
  <circle cx="5" cy="75" r="2" fill="#E2E8F0"/>
  <circle cx="5" cy="90" r="2" fill="#E2E8F0"/>
  <circle cx="5" cy="105" r="2" fill="#E2E8F0"/>

  <!-- Checklist items on paper -->
  <!-- Item 1 -->
  <path d="M24 25L28 29L34 21" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="24" width="24" height="4" rx="2" fill="#CBD5E1"/>
  
  <!-- Item 2 -->
  <path d="M24 45L28 49L34 41" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="44" width="18" height="4" rx="2" fill="#CBD5E1"/>
  
  <!-- Item 3 -->
  <path d="M24 65L28 69L34 61" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="64" width="22" height="4" rx="2" fill="#CBD5E1"/>
  
  <!-- Suffix "++" at the bottom right of the page -->
  <g transform="translate(48, 80) scale(0.8)" stroke="#06B6D4" stroke-width="4" stroke-linecap="round">
    <path d="M0 4H8M4 0V8"/>
    <path d="M10 4H18M14 0V8"/>
  </g>
</svg>
